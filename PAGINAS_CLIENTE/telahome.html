<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../CSS/telahome.css" />

</head>

<body>

<body class="">
  <!-- HEADER (exemplo simples; mantenha o seu se preferir) -->
  <header class="header d-flex align-items-center justify-content-between p-3 border-bottom">
    <div class="logo d-flex align-items-center gap-2">
      <img src="IMG/logoPetAmigo.png" alt="Logo PetAmigo" height="40" />
      <strong>PetAmigo</strong>
    </div>
    <div class="search-box flex-grow-1 mx-3">
      <input class="form-control" type="search" placeholder="Buscar..." />
    </div>
    <div class="icons d-flex align-items-center gap-3">
      <img src="IMG/iconechat.png" alt="Chat" height="28" />
      <img src="IMG/iconecarrinho.png" alt="Carrinho" height="28" />
      <img src="IMG/iconeperfil.png" alt="Perfil" height="28" />
    </div>
  </header>


  <div class="container-fluid p-0">

    <div id="carouselBanners" class="carousel slide carousel-fade" data-bs-ride="carousel">
      <div class="carousel-indicators" id="banners-indicators"></div>
      <div class="carousel-inner" id="banners-home">
        <!-- Itens serão inseridos via JS -->
        <div class="carousel-item active">
          <div class="p-3 text-muted">Carregando banners…</div>
        </div>
      </div>

      <button class="carousel-control-prev" type="button"
              data-bs-target="#carouselBanners" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>

      <button class="carousel-control-next" type="button"
              data-bs-target="#carouselBanners" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Próximo</span>
      </button>
    </div>

    <!-- ====== FILTRO E LISTAGEM DE PRODUTOS POR CATEGORIA ====== -->
      <!-- ====== CATEGORIAS (chips) + PRODUTOS ====== -->
      <section class="container py-4">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <h2 class="h5 mb-0">Categorias</h2>
          <label for="filtro-categoria"
            class="visually-hidden">Categoria</label>
        </div>

        <!-- Chips horizontais -->
        <div id="cats-chips" class="d-flex gap-2 overflow-auto pb-2">
          <button ... data-cat="">Todas as categorias</button>
        </div>

        <!-- Select oculto (fallback/acessibilidade) -->
        <select id="filtro-categoria" class="form-select d-none"
          aria-hidden="true">
          <option value>Todas as categorias</option>
        </select>

        <hr class="my-4" />

        <div class="d-flex align-items-center justify-content-between mb-2">
          <h2 class="h5 mb-0">Produtos</h2>
        </div>

        <div id="produtos-area">
          <div id="produtos-status" class="text-muted">Carregando
            produtos…</div>
          <div id="produtos-grid"
            class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-3"></div>
        </div>
      </section>
   
     <!-- Início - Área de Marcas ---------------------------- -->
<div class="container my-5">
  <h4 class="text-center mb-4">Nossas Marcas Parceiras</h4>
  <div class="row text-center g-4">
    <div class="col-6 col-md-3">
      <img src="../IMG/logo atlas.jpg" class="brand-logo img-fluid" alt="Marca 1">
    </div>
    <div class="col-6 col-md-3">
      <img src="../IMG/logo atlas.jpg" class="brand-logo img-fluid" alt="Marca 2">
    </div>
    <div class="col-6 col-md-3">
      <img src="../IMG/logo atlas.jpg" class="brand-logo img-fluid" alt="Marca 3">
    </div>
    <div class="col-6 col-md-3">
      <img src="../IMG/logo atlas.jpg" class="brand-logo img-fluid" alt="Marca 4">
    </div>
  </div>
</div>
<!-- Fim - Área de Marcas ------------------------------ -->

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../JS/home_cliente.js"></script>
 <script src="../JS/banners.js"></script>
</body>

</html>
